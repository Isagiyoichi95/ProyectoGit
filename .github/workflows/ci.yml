name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Añadir línea de feature al README
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "ci: actualiza README" || echo "Sin cambios"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN contra variable local
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Token válido"
          } else {
            Write-Host "El token no coincide"
            exit 1
          }