name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with feature
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Añadida feature: ${BRANCH}" >> README.md

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README with feature"
          git push

  validate-dev:
    runs-on: self-hosted
    needs: update-readme
    steps:
      - name: Validate development token
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ "$DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ] && [ -n "$DEV_TOKEN" ]; then
            echo "Token de desarrollo válido"
          else
            echo "Token de desarrollo inválido"
            exit 1
          fi
