name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with feature
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Añadida feature: ${BRANCH_NAME}" >> README.md

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README with feature"
          git push

  validate-dev:
    runs-on: self-hosted
    needs: update-readme
    steps:
      - name: Validate development token
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          $LOCAL_TOKEN = [Environment]::GetEnvironmentVariable("LOCAL_DEV_TOKEN", "Machine")
          if ([string]::IsNullOrEmpty($env:DEV_TOKEN)) {
            Write-Host "El secret DEV_TOKEN está vacío"
            exit 1
          }
          if ($env:DEV_TOKEN -ceq $LOCAL_TOKEN) {
            Write-Host "Token de desarrollo válido"
          }
          else {
            Write-Host "Token de desarrollo inválido"
            exit 1
          }
