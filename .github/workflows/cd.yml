name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment version in README
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M:%S')
          if grep -q 'AppVersion-' README.md; then
            VERSION=$(grep -oE 'AppVersion-[0-9]+' README.md | head -1 | grep -oE '[0-9]+')
            NEXT=$((VERSION + 1))
            sed -i "s/AppVersion-${VERSION}/AppVersion-${NEXT}/" README.md
          else
            NEXT=1
            echo "AppVersion-${NEXT}" >> README.md
          fi
          echo "Fecha de actualización: ${DATE}" >> README.md

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Increment application version"
          git push

   validate-prod:
    runs-on: self-hosted
    needs: update-readme
    steps:
      - name: Validate production token
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          $LOCAL_TOKEN = [Environment]::GetEnvironmentVariable("LOCAL_PROD_TOKEN", "Machine")
          if ([string]::IsNullOrEmpty($env:PROD_TOKEN)) {
            Write-Host "El secret PROD_TOKEN está vacío"
            exit 1
          }
          if ($env:PROD_TOKEN -ceq $LOCAL_TOKEN) {
            Write-Host "Token de producción válido"
          }
          else {
            Write-Host "Token de producción inválido"
            exit 1
          }
